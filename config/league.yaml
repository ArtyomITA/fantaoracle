# Configurazione lega target — PROMEMORIA LEGGIBILE, NON E' LA FONTE.
#
# Chi governa davvero, file per file:
#   src/fantabot/rules.py          rosa, budget, sostituzioni, fasce del
#                                  modificatore, bonus porta inviolata, quota
#                                  minima di spesa del piano iniziale
#   src/fantabot/season/lineup.py  soglie dei gol (66, poi uno ogni 6) e moduli
#   scripts/f2_build_packs.py      quote e budget con cui si costruiscono i pack
# Questo file non e' letto da nessuno script: serve solo a leggere le regole in
# chiaro e va tenuto allineato a quelli sopra. In caso di disaccordo vale il
# codice.
# Corretto il 6/9/2026: la fascia 7.0 del modificatore vale +5 (non +6) e i
# crediti aggiunti a gennaio sono 100 (non 50), come confermato dal committente.
participants: 10
budget: 500
roster:
  P: 3
  D: 8
  C: 8
  A: 6
lineup:
  starters: 11
  max_subs: 3
  modules: ["3-4-3", "3-5-2", "4-3-3", "4-4-2", "4-5-1", "5-3-2", "5-4-1"]
scoring:
  goal_threshold: 66     # 66 fantapunti = 1 gol
  goal_step: 6           # +1 gol ogni 6 punti oltre soglia
  modificatore_difesa: true   # CONFERMATO dal committente (7/8/2026)
  mod_difesa_table:      # media voti puri portiere + 3 migliori difensori
    "6.0": 1
    "6.25": 2
    "6.5": 3
    "6.75": 4
    "7.0": 5
repair_context:          # contesto lega reale (non ancora nel modello)
  extra_credits: 100     # a gennaio si aggiungono 100 crediti + svincoli
  typical_leftover: "<50"  # quasi nessuno arriva a gennaio con piu' di 50
auction:
  role_order: ["P", "D", "C", "A"]   # asta per ruoli in blocchi
  min_increment: 1
  min_price: 1
  nomination: rotation               # giro di chiamata a rotazione, ordine iniziale da seed
seasons:
  "2024-25":
    auction_date: "2024-09-01"       # giorno dopo chiusura mercato estivo 2024
  "2025-26":
    auction_date: "2025-09-02"       # giorno dopo chiusura mercato estivo 2025
repair_auction: false
